name: iOS build and end-to-end tests
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md', 'LICENSE', '.gitignore']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Rules, timers, restoration, and performance tests
        run: swift test --jobs 3
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Choose an available iPhone simulator
        id: simulator
        run: python3 scripts/select-simulator.py >> "$GITHUB_OUTPUT"
      - name: iOS simulator end-to-end tests
        run: |
          xcodebuild test \
            -project Connect4x4.xcodeproj -scheme Connect4x4 \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -derivedDataPath DerivedData -resultBundlePath test-results/iOS.xcresult \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO
      - name: Build for physical iOS devices without signing
        run: |
          xcodebuild build \
            -project Connect4x4.xcodeproj -scheme Connect4x4 \
            -destination 'generic/platform=iOS' -configuration Release \
            -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO
      - name: Save simulator build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-build-and-test-evidence
          path: |
            test-results/
            DerivedData/Build/Products/Debug-iphonesimulator/Connect4x4.app
          retention-days: 14
