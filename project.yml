name: Connect4x4
options:
  bundleIdPrefix: io.github.kas5852
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  Connect4x4:
    path: .
targets:
  Connect4x4:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: Connect4x4
        product: ConnectUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kas5852.Connect4x4
        PRODUCT_NAME: Connect4x4
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Connect 4x4
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.strategy-games
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/Connect4x4.entitlements
  Connect4x4UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Connect4x4
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kas5852.Connect4x4UITests
schemes:
  Connect4x4:
    build:
      targets:
        Connect4x4: all
        Connect4x4UITests: [test]
    test:
      targets:
        - Connect4x4UITests
      gatherCoverageData: true
